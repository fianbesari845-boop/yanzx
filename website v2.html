<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>E-Learning Pemrograman</title>
<style>
body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#141e30,#243b55);
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.box{
    background:#fff;
    width:95%;
    max-width:1000px;
    padding:30px;
    border-radius:22px;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
    position:relative;
}
.center{text-align:center}
.hidden{display:none}

input, select{
    width:80%;
    padding:12px;
    margin:8px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    padding:12px 22px;
    border:none;
    border-radius:14px;
    background:#243b55;
    color:white;
    cursor:pointer;
    margin:6px;
    transition:.25s;
}
button:hover{background:#141e30}

/* ===== MATERI LAYOUT ===== */
.materi-wrap{
    display:flex;
    gap:20px;
    align-items:flex-start;
    opacity:1;
    transition:opacity .5s;
    flex-wrap:wrap;
}
.materi-wrap img{
    width:180px;
    border-radius:10px;
}
.materi-text{
    text-align:justify;
    line-height:1.7;
    flex:1;
    min-width:250px;
}

/* ===== KUIS ===== */
.option{
    width:90%;
    display:block;
    margin:10px auto;
    padding:14px;
    border-radius:14px;
    background:#f1f1f1;
    font-size:15px;
    cursor:pointer;
    transition:.2s;
}
.option:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 18px rgba(0,0,0,.25);
}
.benar{background:#2ecc71;color:white}
.salah{background:#e74c3c;color:white}

/* ===== HASIL ===== */
.hasil-box{
    max-width:500px;
    margin:0 auto;
    padding:20px;
}
@media(max-width:768px){
    .materi-wrap{flex-direction:column;align-items:center;}
}
</style>
</head>

<body>

<div class="box">

<!-- LOGIN -->
<div id="login" class="center">
    <h2>📘 E-Learning Pemrograman</h2>
    <p>Masukkan data untuk memulai</p>
    <input id="nama" placeholder="Nama Siswa">
    <select id="sekolah">
        <option value="">Pilih Sekolah</option>
        <option>SMP 2 BATANG</option>
        <option>SMP 3 BATANG</option>
        <option>MTS NU BATANG</option>
        <option>MTS MUHAMMADIYAH BATANG</option>
    </select>
    <br>
    <button onclick="mulai()">Masuk</button>
</div>

<!-- MATERI -->
<div id="materi" class="hidden">
    <h2 id="judul"></h2>
    <div class="materi-wrap" id="materiWrap">
        <img id="gambar">
        <div class="materi-text" id="isi"></div>
    </div>
    <div class="center">
        <button onclick="prev()">⬅ Sebelumnya</button>
        <button onclick="next()">Materi Selanjutnya ➡</button>
    </div>
</div>

<!-- KUIS -->
<div id="kuis" class="hidden center">
    <h2 id="soal"></h2>
    <div id="opsi"></div>
</div>

<!-- HASIL -->
<div id="hasil" class="hidden center">
    <div class="hasil-box">
        <h2>🎉 CONGRATULATIONS!</h2>
        <p><b id="hNama"></b></p>
        <p><b id="hSekolah"></b></p>
        <p>Skor Akhir: <b id="hSkor"></b></p>
        <p>Benar: <b id="hBenar"></b> | Salah: <b id="hSalah"></b></p>
        <button onclick="reset()">🔁 KEMBALI KE HALAMAN LOGIN</button>
    </div>
</div>

</div>

<script>
let i=0, skor=0, benar=0, salah=0, nama="", sekolah="";
const materiWrap=document.getElementById("materiWrap");

/* ===== MATERI DETAIL 20 TOPIK ===== */
const materi=[
{j:"Apa itu Pemrograman", i:`Pemrograman adalah proses memberi instruksi kepada komputer
agar dapat melakukan tugas tertentu seperti membuat website,
aplikasi, game, dan sistem digital lainnya.

Dengan pemrograman, komputer bisa bekerja otomatis sesuai perintah.`},
{j:"Manfaat Pemrograman", i:`Belajar pemrograman memiliki banyak manfaat:
• Melatih logika berpikir
• Meningkatkan kreativitas
• Membantu memecahkan masalah
• Membuka peluang kerja
• Bisa membuat aplikasi sendiri`},
{j:"HTML", i:`HTML (HyperText Markup Language) digunakan untuk membuat
struktur dasar website seperti judul, paragraf, gambar,
tabel, dan form.

HTML ibarat kerangka tubuh website.`},
{j:"CSS", i:`CSS (Cascading Style Sheets) digunakan untuk mengatur tampilan website.

CSS mengatur:
• Warna
• Ukuran teks
• Layout
• Animasi
Tanpa CSS, website terlihat polos.`},
{j:"JavaScript", i:`JavaScript membuat website menjadi interaktif.

Digunakan untuk:
• Tombol
• Validasi form
• Game
• Kuis
• Animasi`},
{j:"Python", i:`Python adalah bahasa pemrograman populer karena
mudah dipelajari dan kuat.

Digunakan untuk AI, data science,
aplikasi, dan backend website.`},
{j:"Struktur HTML", i:"<html> untuk root, <head> untuk metadata, <body> untuk konten utama."},
{j:"Heading & Paragraf", i:"<h1>-<h6> untuk judul, <p> untuk paragraf."},
{j:"Link & Gambar", i:"<a> untuk tautan, <img> untuk menampilkan gambar."},
{j:"List & Table", i:"<ul>/<ol> untuk daftar, <table> untuk tabel."},
{j:"Form HTML", i:"<form> untuk input data, <input>, <select>, <button> untuk interaksi."},
{j:"Selektor CSS", i:".class, #id, tag selector untuk menambahkan style."},
{j:"Box Model", i:"Margin, border, padding, content untuk tiap elemen HTML."},
{j:"Flexbox & Grid", i:"Flexbox & Grid digunakan untuk layout responsif dan rapi."},
{j:"Animasi CSS", i:"Transisi, transform, hover effects untuk interaktivitas."},
{j:"JavaScript Dasar", i:"Membuat website interaktif, contoh alert(), onclick events."},
{j:"Variabel & Function JS", i:"Menyimpan data & membuat fungsi yang bisa dipanggil berkali-kali."},
{j:"DOM & Event Handling", i:"Mengubah HTML lewat JS & menangkap aksi pengguna seperti klik, hover."},
{j:"Python Dasar", i:"Bahasa sederhana dan fleksibel, contoh print(), for loop."},
{j:"Python Mini Project", i:"Contoh project sederhana: kalkulator, konversi suhu, dll."}
];

/* ===== KUIS ===== */
let kuis=[
{soal:"HTML digunakan untuk?",opsi:["Struktur","Desain","Server","Database"],jawab:0},
{soal:"CSS berfungsi untuk?",opsi:["Logika","Tampilan","Server","CPU"],jawab:1},
{soal:"Website interaktif memakai?",opsi:["HTML","CSS","JavaScript","Python"],jawab:2},
{soal:"Python terkenal karena?",opsi:["Sulit","Sederhana","Jarang","Lama"],jawab:1},
{soal:"Programmer pertama?",opsi:["Bill Gates","Ada Lovelace","Jobs","Elon Musk"],jawab:1},
{soal:"HTML termasuk?",opsi:["Bahasa","Markup","OS","DB"],jawab:1},
{soal:"CSS bisa membuat?",opsi:["Animasi","Database","Server","CPU"],jawab:0},
{soal:"JavaScript berjalan di?",opsi:["Browser","RAM","CPU","Harddisk"],jawab:0},
{soal:"Python dipakai untuk?",opsi:["AI","Web","Game","Semua"],jawab:3},
{soal:"Website modern butuh?",opsi:["HTML","CSS","JS","Semua"],jawab:3}
];
kuis=kuis.sort(()=>Math.random()-0.5);

/* ===== LOGIC ===== */
const namaInput=document.getElementById("nama");
const sekolahInput=document.getElementById("sekolah");
const materiDiv=document.getElementById("materi");
const kuisDiv=document.getElementById("kuis");

function mulai(){
    nama=namaInput.value;
    sekolah=sekolahInput.value;
    if(!nama||!sekolah){alert("Harus mengisi Nama dan Sekolah!");return;}
    login.classList.add("hidden");
    materiDiv.classList.remove("hidden");
    tampilMateri();
}

function tampilMateri(){
    materiWrap.style.opacity=0;
    setTimeout(()=>{
        judul.innerText=materi[i].j;
        isi.innerText=materi[i].i;
        gambar.src="https://cdn-icons-png.flaticon.com/512/2721/2721296.png";
        materiWrap.style.opacity=1;
    },300);
}

function next(){
    if(i<materi.length-1){i++; tampilMateri();}
    else{
        materiDiv.classList.add("hidden");
        kuisDiv.classList.remove("hidden");
        i=0;
        tampilKuis();
    }
}
function prev(){if(i>0){i--; tampilMateri();}}

function tampilKuis(){
    soal.innerText=kuis[i].soal;
    opsi.innerHTML="";
    kuis[i].opsi.forEach((o,n)=>{
        opsi.innerHTML+=`<div class="option" onclick="jawab(this,${n})">${o}</div>`;
    });
}

function jawab(el,p){
    const benarIndex=kuis[i].jawab;
    document.querySelectorAll(".option").forEach(o=>o.onclick=null);

    if(p===benarIndex){
        el.classList.add("benar");
        skor+=10; benar++;
    }else{
        el.classList.add("salah");
        document.querySelectorAll(".option")[benarIndex].classList.add("benar");
        skor+=5; salah++;
    }

    setTimeout(()=>{
        i++;
        if(i<kuis.length) tampilKuis();
        else{
            kuisDiv.classList.add("hidden");
            hasil.classList.remove("hidden");
            hNama.innerText=nama;
            hSekolah.innerText=sekolah;
            hSkor.innerText=skor;
            hBenar.innerText=benar;
            hSalah.innerText=salah;
        }
    },900);
}

function reset(){location.reload();}
</script>
</body>
</html>
